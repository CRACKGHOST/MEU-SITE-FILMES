<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEU SITE FILMES</title>
<style>
body{margin:0;background:#0f0f0f;color:#fff;font-family:Arial}
h1{text-align:center;padding:15px}
.grade{display:flex;flex-wrap:wrap;justify-content:center;gap:15px;padding:15px}
.card{width:140px;cursor:pointer}
.card img{width:100%;border-radius:10px}
.card p{text-align:center;font-size:14px}
#player{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;display:none;z-index:999}
#player video{width:100%;height:90%}
#player button{padding:10px;width:100%;background:red;color:#fff;border:0;font-size:18px}
</style>
</head>
<body>
<h1>🎬 MEU SITE FILMES</h1>

<div class="grade">
  <div class="card" onclick="ver('https://www.w3schools.com/html/mov_bbb.mp4')">
    <img src="https://image.tmdb.org/t/p/w200/qW4crfED8mpNDadSmMdi7ZDzhXF.jpg">
    <p>Filme Teste 1</p>
  </div>
  <div class="card" onclick="ver('https://www.w3schools.com/html/movie.mp4')">
    <img src="https://image.tmdb.org/t/p/w200/74xTEgt7R36Fpooo50r9T25onhq.jpg">
    <p>Filme Teste 2</p>
  </div>
</div>

<div id="player">
  <button onclick="fechar()">X FECHAR</button>
  <video id="video" controls autoplay></video>
</div>

<script>
function ver(link){
  document.getElementById('video').src=link;
  document.getElementById('player').style.display='block';
}
function fechar(){
  document.getElementById('player').style.display='none';
  document.getElementById('video').pause();
  document.getElementById('video').src='';
}
  <div class="card" onclick="ver('LINK-DO-FILME-AQUI')">
  <img src="LINK-DA-CAPA-AQUI">
  <p>NOME DO FILME</p>
</div>
</script>
</body>
</html>
